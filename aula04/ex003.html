<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body {
            background-color: rgb(126, 126, 203);
            color: #ffffff;
            font: normal 20px arial;
        }

        h1 {
            color: yellow;
        }
        
    </style>
</head>
<body>
    <h1>Hello, World with Js!</h1>
    <p>Me livrei da maldição</p>
    <script>
       var n1 = Number.parseInt(window.prompt('Digite um número: ')) //prompt retorna string
       var n2 = Number.parseInt(window.prompt('Digite outro número: ')) //string 
       var s = n1 + n2
       window.alert('A soma dos valores é ' + s) // Concatenação
       // (number + number) para adição (soma)
       //(string + string) para concatenação

    </script>
</body>
</html>
